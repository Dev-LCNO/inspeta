# Publica tudo a cada push na main: banco (migrações), funções e configuração do Supabase, e o app no GitHub Pages.
# Valores: Settings → Secrets and variables → Actions (lista em .env.example). Nenhum valor fica no repositório.
name: Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  conferir:
    name: Conferir configuração
    runs-on: ubuntu-latest
    steps:
      - name: Variáveis e segredos obrigatórios
        run: |
          falta=""
          [ -n "$SUPABASE_PROJECT_REF" ] || falta="$falta SUPABASE_PROJECT_REF(variável)"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || falta="$falta SUPABASE_ACCESS_TOKEN(segredo)"
          [ -n "$SUPABASE_DB_PASSWORD" ] || falta="$falta SUPABASE_DB_PASSWORD(segredo)"
          if [ -n "$falta" ]; then echo "::error::Faltam no GitHub:$falta (veja replica/backend.md)"; exit 1; fi

  backend:
    name: Supabase (banco, funções, auth)
    needs: conferir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install
      - name: Empacotar funções
        run: NODE_PATH=$PWD/node_modules ./scripts/build-funcoes.sh
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Ligar ao projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - name: Migrações do banco
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Segredos das funções (só os opcionais)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ vars.EMAIL_REMETENTE }}
        run: |
          f=$(mktemp)
          { [ -n "$RESEND_API_KEY" ] && echo "RESEND_API_KEY=$RESEND_API_KEY"
            [ -n "$EMAIL_REMETENTE" ] && echo "EMAIL_REMETENTE=$EMAIL_REMETENTE"; } > "$f" || true
          [ -s "$f" ] && supabase secrets set --env-file "$f" --project-ref "$SUPABASE_PROJECT_REF" || echo "sem segredos opcionais"
          rm -f "$f"
      - name: Funções api e jobs
        run: |
          supabase functions deploy api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy jobs --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
